name: Weekly Pipeline
on:
  schedule:
    - cron: '0 14 * * 0'   # UTC 14:00 every Sunday
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan curated sources → candidate pre-screening
        run: python pipeline.py scan --direct
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}

      - name: Weekly deep scrape (approved companies)
        run: python pipeline.py weekly --direct
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}

      - name: Generate weekly digest
        run: python pipeline.py digest --direct
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Export dashboard data
        run: python export.py

      - name: Commit DB + data.json + digests
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@noreply.github.com"
          git add competitors.db data.json digests/ || true
          git diff --staged --quiet || git commit -m "weekly: $(date -u +%Y-%m-%d)"
          git push
